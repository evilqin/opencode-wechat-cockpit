name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: 类型检查 + 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: path handling, file locking and rename races differ
        # from Linux, and this plugin writes state files on Windows for real.
        os: [ubuntu-latest, windows-latest]
    # A hung test or install must not burn the 360-minute default.
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a future Bun release must not be able to break CI by itself.
          bun-version: 1.4.3

      - name: 安装类型检查依赖（types/ 子目录）
        working-directory: types
        run: bun install --frozen-lockfile

      - name: 类型检查（strict + noUnusedLocals）
        run: bun run typecheck

      - name: 测试（单元 + mock iLink + Bridge 行为）
        # 显式给出临时路径：不依赖 bun 的 preload 行为，也不会碰到任何真实凭据
        env:
          WECHAT_STATE_DIR: ${{ runner.temp }}/wechat-test-state
          WECHAT_SERVICE_FILE: ${{ runner.temp }}/wechat-test-state/service.json
        run: |
          node -e "require('node:fs').mkdirSync(process.env.WECHAT_STATE_DIR, { recursive: true })"
          bun test

      - name: 文档测试数与代码一致
        run: node scripts/check-docs.mjs

      - name: 手册与代码同源（MANUAL.md 无漂移）
        shell: bash
        run: |
          bun gen-manual.ts
          # `git diff` alone ignores untracked files, so a PR that deleted
          # MANUAL.md would pass with the regenerated copy sitting untracked.
          git diff --exit-code -- MANUAL.md
          test -z "$(git status --porcelain -- MANUAL.md)"
